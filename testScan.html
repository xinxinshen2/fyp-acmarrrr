<!DOCTYPE html>
<html>
<head>
<title>Barcode Scanner</title>
<style>
  body {
    margin: 0;
    overflow: hidden; /* Prevent scrollbars */
    font-family: sans-serif;
  }

  #preview {
    width: 100vw;
    height: 100vh;
    display: block;
    object-fit: cover; /* Cover the entire viewport */
    position: fixed; /* Fixed position to cover the whole page */
    top: 0;
    left: 0;
    z-index: 1; /* Below the overlay */
  }

  #scan-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.6); /* Dark semi-transparent overlay */
    z-index: 2; /* Above the camera preview */
    pointer-events: none; /* Make it click-through */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #scan-region {
    width: 60vw; /* Adjust as needed */
    height: 40vh; /* Adjust as needed */
    border: 2px solid white; /* White border for the scan region */
    box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.6); /* Create cutout effect */
    position: relative; /* For positioning the scan instructions */
  }

  #scan-instructions {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    text-align: center;
    z-index: 3; /* Above the overlay and scan region */
  }

  #barcode-result {
    position: fixed;
    top: 20px; /* Adjust as needed */
    left: 50%;
    transform: translateX(-50%);
    background-color: white;
    padding: 20px;
    border-radius: 5px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    z-index: 4;
    visibility: hidden; /* Initially hidden */
  }
</style>
</head>
<body>
  <video id="preview"></video>
  <div id="scan-overlay">
    <div id="scan-region"></div>
    <div id="scan-instructions">
      Place barcode within the white rectangle to scan.
    </div>
  </div>
  <div id="barcode-result">
    Barcode Scanned: <span id="barcode-number"></span>
  </div>

  <script type="module">
    import { BrowserBarcodeReader } from 'https://cdn.jsdelivr.net/npm/@zxing/browser@latest/esm/index.min.js'

    const previewElem = document.getElementById('preview');
    const barcodeResultElem = document.getElementById('barcode-result');
    const barcodeNumberElem = document.getElementById('barcode-number');
    const codeReader = new BrowserBarcodeReader();

    let scanning = false; // Flag to control scanning

    function startScanning() {
      if (scanning) return; // Prevent multiple starts
      scanning = true;

      codeReader
      .decodeFromInputVideoDevice(undefined, previewElem)
      .then(result => {
          scanning = false; // Stop scanning after successful scan
          console.log(result.text);
          barcodeNumberElem.textContent = result.text;
          barcodeResultElem.style.visibility = 'visible'; // Show result popup
          setTimeout(() => {
            barcodeResultElem.style.visibility = 'hidden'; // Hide popup after a delay
          }, 3000); // Hide after 3 seconds (adjust as needed)

          // Optionally stop the reader after one scan
          // codeReader.reset();
        })
      .catch(err => {
          scanning = false;
          console.error(err);
          // You might want to handle errors more visibly to the user
        });
    }


    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => {
        previewElem.srcObject = stream;
        previewElem.play();
        startScanning(); // Start scanning after camera is ready
      })
    .catch(error => {
        console.error("Camera access error:", error);
        alert("Could not access camera. Please make sure you have a camera and allow camera access.");
      });


  </script>
</body>
</html>
