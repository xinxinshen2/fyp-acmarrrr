<body>

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        window.onload = function() {
            const lectureID = sessionStorage.getItem('lectureID');
            if (lectureID) {
                document.getElementById('lectureIDDisplay').textContent = lectureID;
