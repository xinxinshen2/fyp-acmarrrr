    let pressTimer;

    const startProgress = () => {
        let time = 0;
        const totalTime = 3000; 
        const circumference = 284; // 矩形周长 (2 * (width + height) - 8 * rx)

        progressInterval = setInterval(() => {
            time += 10; // Update every 10ms
            const progress = (time / totalTime) * circumference;
            progressRect.style.strokeDashoffset = circumference - progress;

            if (time >= totalTime) {
                clearInterval(progressInterval);
                logout(); 
            }
        }, 10);
    };

    const resetProgress = () => {
        clearInterval(progressInterval);
        progressRect.style.strokeDashoffset = 284; 
    };


    logoutButton.addEventListener("mousedown", startProgress);
    logoutButton.addEventListener("mouseup", resetProgress);
    logoutButton.addEventListener("mouseleave", resetProgress);

async function fetchUsers() {
    console.log("Current Filter Status:", filterState);
    userContainer.innerHTML = "<p>Loading...</p>";

    let users = [];

    try {

        const adminSnapshot = await getDocs(collection(db, "admin"));
        adminSnapshot.forEach(doc => {
            users.push({ id: doc.data().ID, name: doc.data().name, email: doc.data().email, role: "admin" });
        });


        const lecturerSnapshot = await getDocs(collection(db, "lecturer"));
        lecturerSnapshot.forEach(doc => {
            users.push({ id: doc.data().ID, name: doc.data().name, email: doc.data().email, role: "lecturer" });
        });


        const studentSnapshot = await getDocs(collection(db, "student"));
        studentSnapshot.forEach(doc => {
            users.push({ id: doc.data().ID, name: doc.data().name, email: doc.data().email, role: "student" });
        });


        let filteredUsers = users;
        if (filterState === "student") {
            filteredUsers = users.filter(user => user.role === "student");
        } else if (filterState === "lecturer") {
            filteredUsers = users.filter(user => user.role === "lecturer");
        }

        displayUsers(filteredUsers);

    } catch (error) {
        console.error("获取数据时出错:", error);
        userContainer.innerHTML = "<p>数据加载失败，请检查数据库连接。</p>";
    }
}

  // 2. 根据所选课程加载 timetable
  async function loadTimetable(courseId) {
    // 创建一个对象保存星期对应的 session 数组
    const sessionsByDay = {
      Monday: [],
      Tuesday: [],
      Wednesday: [],
      Thursday: [],
      Friday: [],
      Saturday: [],
      Sunday: []
    };

    try {
      // 获取指定课程的文档引用
      const courseDocRef = doc(db, "course", courseId);
      // 获取该课程下的 "subject" 子集合所有文档
      const subjectSnapshot = await getDocs(collection(courseDocRef, "subject"));
      subjectSnapshot.forEach(subDoc => {
        const subjectData = subDoc.data();
        // subjectData 应包含 lecturerID, name, sessions（数组）
        if (subjectData.sessions && Array.isArray(subjectData.sessions)) {
          subjectData.sessions.forEach(session => {
            // 假设 session.day 为完整的英文星期，如 "Monday"
            if (sessionsByDay[session.day]) {
              sessionsByDay[session.day].push({
                subjectName: subjectData.name,
                class: subjectData.class,
                lecturerID: subjectData.lecturerName,
                startTime: session.startTime,
                endTime: session.endTime,
                type: session.type
              });
            }
          });
        }
      });

      // 对每一天的 sessions 按 startTime 从早到晚排序
      for (const day in sessionsByDay) {
        sessionsByDay[day].sort((a, b) => a.startTime.localeCompare(b.startTime));
      }

      // 渲染 timetable 表格
      renderTimetable(sessionsByDay);
    } catch (error) {
      console.error("Error loading timetable: ", error);
      document.querySelector(".tableDisplay").innerHTML = "<p>Error loading timetable.</p>";
    }
  }

  // 3. 根据 sessionsByDay 对象渲染 timetable 表格
  function renderTimetable(sessionsByDay) {
    const tableDisplay = document.querySelector(".tableDisplay");
    let html = "<table style='width:100%; border-collapse: separate; border-spacing: 0;'>";
    // 每一行显示一个星期的 session
    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    days.forEach(day => {
      html += `<tr style="border: 1px solid #ccc;">`;
      // 第一列显示星期名称
      html += `<td style="padding: 8px; border: 1px solid #ccc; font-weight: bold; background: #f2f2f2;">${day}</td>`;
      // 后续列显示当天所有的 sessions（如果有多个 session，则各自占用一个 cell）
      if (sessionsByDay[day].length > 0) {
        sessionsByDay[day].forEach(session => {
          html += `<td style="padding: 8px; border: 1px solid #ccc; text-align: center;">
                   <strong>${session.subjectName}</strong> (${session.type}) <br><br>
                  <strong> Venue: </strong>${session.class}<br>
                   <strong> Time: </strong>${session.startTime} - ${session.endTime}<br>
                   <strong> Lecturer: </strong> ${session.lecturerID}<br>
                    
                   </td>`;

                //    subjectName: subjectData.name,
                // class: subjectData.class,
                // lecturerID: subjectData.lecturerName,
                // startTime: session.startTime,
                // endTime: session.endTime,
                // type: session.type
        });
      } else {
        // 如果没有 session，则填充空 cell
        html += `<td style="padding: 8px; border: 1px solid #ccc;">-</td>`;

 async function loadCoursesForAdd() {
    const select = document.getElementById("courseSelectAdd");
    try {
      const courseSnapshot = await getDocs(collection(db, "course"));
      courseSnapshot.forEach(docSnap => {
        const courseId = docSnap.id;

function formatTime(timeStr) {
  let [hours, minutes] = timeStr.split(':');
  hours = parseInt(hours, 10);
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12;
  if (hours === 0) hours = 12;
  return `${hours}:${minutes} ${ampm}`;
}

  async function loadClasses() {
  const select = document.getElementById("classSelect");
  try {
    const classSnapshot = await getDocs(collection(db, "class"));
    classSnapshot.forEach(docSnap => {
      const option = document.createElement("option");
      option.value = docSnap.id;
      option.textContent = docSnap.id; // You can customize to display additional info if needed
      select.appendChild(option);
    });
  } catch (error) {
    console.error("Error loading classes:", error);
  }
}


  // Helper function to load lecturers into the add timetable form
  async function loadLecturersForAdd() {
    const select = document.getElementById("lecturerSelect");
    try {
      const lecturerSnapshot = await getDocs(collection(db, "lecturer"));
      lecturerSnapshot.forEach(docSnap => {
        const lecturerData = docSnap.data();
        const option = document.createElement("option");
        option.value = docSnap.id;  // Use document id as lecturerID
        option.textContent = lecturerData.name + " (" + docSnap.id + ")";
        select.appendChild(option);
      });
    } catch (error) {
      console.error("Error loading lecturers:", error);
    }
  }

  // Helper function to check for session conflicts in the selected course
  async function checkSessionConflict(courseId, day, startTime, endTime) {
    try {
      const courseRef = doc(db, "course", courseId);
      const subjectSnapshot = await getDocs(collection(courseRef, "subject"));
      let conflict = false;
      subjectSnapshot.forEach(subDoc => {
        const subjectData = subDoc.data();
        if (subjectData.sessions && Array.isArray(subjectData.sessions)) {
          subjectData.sessions.forEach(session => {
            if (session.day === day &&
                session.startTime === startTime &&
                session.endTime === endTime) {
              conflict = true;
            }
          });
        }
      });
      return conflict;
    } catch (error) {
      console.error("Error checking session conflict:", error);
      return false;
    }
  }

        <input type="text" id="searchInput" class="search-bar" placeholder="Search users...">
        </div>
        <div class="currentOpen"></div>
    </div>

    <div class="timeTableSpace AllSpace">
      <p> Timetable</p>
      <div class="selectCourse function-Btn"></div>    
      <button class="function-Btn" id="addTimetableBtn">
        <i class="fas fa-calendar-plus"></i> Add Timetable
      </button>
      <div class="tableDisplay"></div>
      <div id="alert-Timetable" style="display: none;"></div>
    </div>
    
</body>

<script>
    document.addEventListener("DOMContentLoaded", function () {
    const homeBtn = document.querySelector(".nav-btn:nth-child(1)");
    const viewUserBtn = document.querySelector(".nav-btn:nth-child(2)"); // View User 按钮
    const dataAnalysisBtn = document.querySelector(".nav-btn:nth-child(3)"); // Data Analysis 按钮
    const timeTableBtn = document.querySelector(".nav-btn:nth-child(4)")
    const dataSpace = document.querySelector(".dataSpace"); // 数据分析区域
    const functionSpace = document.querySelector(".functionSpace"); // 用户管理功能区域
    const homeSpace = document.querySelector(".homeSpace");
    const timeTableSpace = document.querySelector(".timeTableSpace");

    // 初始状态：显示 Data Analysis，隐藏 functionSpace
    homeSpace.style.display = "block";
    dataSpace.style.display = "block";
    functionSpace.style.display = "block";
    timeTableSpace.style.display= "block";


    // 点击 "View User" 按钮时
    viewUserBtn.addEventListener("click", function () {
        dataSpace.style.display = "none";  // 隐藏数据分析
        homeSpace.style.display = "none";
        functionSpace.style.display = "block"; // 显示用户管理功能
        timeTableSpace.style.display= "none";

    });

    // 点击 "Data Analysis" 按钮时
    dataAnalysisBtn.addEventListener("click", function () {
        homeSpace.style.display="none";
        dataSpace.style.display = "block";  // 显示数据分析
        functionSpace.style.display = "none"; // 隐藏用户管理功能
        timeTableSpace.style.display= "none";

    });

    homeBtn.addEventListener("click",function(){
        homeSpace.style.display="block";
        functionSpace.style.display = "block"; 
        dataSpace.style.display = "block";
        timeTableSpace.style.display= "block";
    });

    timeTableBtn.addEventListener("click",function(){
        homeSpace.style.display="none";
        functionSpace.style.display = "none"; 
        dataSpace.style.display = "none";
        timeTableSpace.style.display= "block";
    });

});

</script>
</html>
