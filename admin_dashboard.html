async function loadAdminName() {
  const adminID = sessionStorage.getItem('adminID');

  }

  const adminRef = doc(db, "admin", adminID);
  const adminDoc = await getDoc(adminRef);

  if (adminDoc.exists()) {
    const adminData = adminDoc.data();
    console.log("Admin data retrieved:", adminData); 
     const displayText = `${adminData.name} (${adminData.ID})`;
    document.getElementById('username').textContent =displayText;
  } else {
    console.error("No such document!");
  }
}

    const progressRect = document.querySelector(".progress-ring-rect");
    let pressTimer;
    let progressInterval;

    const startProgress = () => {
        let time = 0;
        const totalTime = 3000; 
        const circumference = 284; // 矩形周长 (2 * (width + height) - 8 * rx)

        progressInterval = setInterval(() => {
            time += 10; // Update every 10ms
            const progress = (time / totalTime) * circumference;
            progressRect.style.strokeDashoffset = circumference - progress;

            if (time >= totalTime) {
                clearInterval(progressInterval);
                logout(); 
            }
        }, 10);
    };

    const resetProgress = () => {
        clearInterval(progressInterval);
        progressRect.style.strokeDashoffset = 284; 
    };


    logoutButton.addEventListener("mousedown", startProgress);
    logoutButton.addEventListener("mouseup", resetProgress);
    logoutButton.addEventListener("mouseleave", resetProgress);

    logoutButton.addEventListener("touchend", resetProgress);

async function fetchUsers() {
    console.log("Current Filter Status:", filterState);
    userContainer.innerHTML = "<p>Loading...</p>";

    let users = [];

    try {

        const adminSnapshot = await getDocs(collection(db, "admin"));
        adminSnapshot.forEach(doc => {
            users.push({ id: doc.data().ID, name: doc.data().name, email: doc.data().email, role: "admin" });
        });


        const lecturerSnapshot = await getDocs(collection(db, "lecturer"));
        lecturerSnapshot.forEach(doc => {
            users.push({ id: doc.data().ID, name: doc.data().name, email: doc.data().email, role: "lecturer" });
        });


        const studentSnapshot = await getDocs(collection(db, "student"));
        studentSnapshot.forEach(doc => {
            users.push({ id: doc.data().ID, name: doc.data().name, email: doc.data().email, role: "student" });
        });


        let filteredUsers = users;
        if (filterState === "student") {
            filteredUsers = users.filter(user => user.role === "student");
        } else if (filterState === "lecturer") {
            filteredUsers = users.filter(user => user.role === "lecturer");
        }

        displayUsers(filteredUsers);

    } catch (error) {
        console.error("获取数据时出错:", error);
        userContainer.innerHTML = "<p>数据加载失败，请检查数据库连接。</p>";
    }
}


function displayUsers(users) {
    userContainer.innerHTML = ""; 

    if (users.length === 0) {
        userContainer.innerHTML = "<p>No users found.</p>";
        return;
    }

    const table = document.createElement("table");
    table.border = "1";
    table.style.width = "100%";
    table.style.borderCollapse = "collapse";

    const thead = document.createElement("thead");
    thead.innerHTML = `
        <tr style="background-color: #f2f2f2; text-align: left;">
            <th style="padding: 10px;">No.</th>
            <th style="padding: 10px;">ID</th>
            <th style="padding: 10px;">Name</th>
            <th style="padding: 10px;">Email</th>
            <th style="padding: 10px;">Role</th>
        </tr>
    `;
    table.appendChild(thead);

    const tbody = document.createElement("tbody");

    users.forEach((user, index) => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td style="padding: 10px; text-align: center;">${index + 1}</td>
            <td style="padding: 10px;">${user.id}</td>
            <td style="padding: 10px;">${user.name}</td>
            <td style="padding: 10px;">${user.email}</td>
            <td style="padding: 10px;">${user.role}</td>
        `;

        tbody.appendChild(row);
    });

    table.appendChild(tbody);
    userContainer.appendChild(table);
    
}

        async function populateCourseOptions() {
  const courseSelect = document.getElementById("course");
  try {
    const coursesSnapshot = await getDocs(collection(db, "course"));
    coursesSnapshot.forEach(docSnap => {
      const option = document.createElement("option");
      option.value = docSnap.id;
      option.textContent = docSnap.id;
      courseSelect.appendChild(option);
    });
  } catch (error) {
    console.error("获取课程列表出错:", error);
    alert("获取课程列表出错，请检查控制台了解详细信息。");
  }
}
populateCourseOptions();



document.getElementById("course").addEventListener("change", async (e) => {
  const selectedCourse = e.target.value;

  const role = document.getElementById("role").value;
  if (role !== "student") {
    return;
  }
  
  try {

    const studentsQuery = query(
      collection(db, "student"),
      where("course", "==", selectedCourse)
    );
    const querySnapshot = await getDocs(studentsQuery);
    

    let maxId = 0;
    querySnapshot.forEach((docSnap) => {
      const currentId = parseInt(docSnap.id, 10);
      if (!isNaN(currentId) && currentId > maxId) {
        maxId = currentId;
      }
    });
    

    const newID = (maxId + 1).toString();
    console.log("New Student ID:", newID);
    

    document.getElementById("idDisplay").textContent = newID;
    
  } catch (error) {
    console.error("查询学生记录出错：", error);
    alert("查询学生记录出错，请检查控制台了解详细信息。");
  }
});

async function fetchUsersForDelete() {
  let users = [];
  try {

    const adminSnapshot = await getDocs(collection(db, "admin"));
    adminSnapshot.forEach(docSnap => {
      const data = docSnap.data();
      users.push({ 
        id: data.ID, 
        name: data.name, 
        email: data.email, 
        role: "admin",
        authUid: data.authUid 
      });
    });

    const lecturerSnapshot = await getDocs(collection(db, "lecturer"));
    lecturerSnapshot.forEach(docSnap => {
      const data = docSnap.data();
      users.push({ 
        id: data.ID, 
        name: data.name, 
        email: data.email, 
        role: "teacher",
        authUid: data.authUid 
      });
    });

    const studentSnapshot = await getDocs(collection(db, "student"));
    studentSnapshot.forEach(docSnap => {
      const data = docSnap.data();
      users.push({ 
        id: data.ID, 
        name: data.name, 
        email: data.email, 
        role: "student",
        authUid: data.authUid 
      });
    });
    

    displayUsersForDelete(users);
  } catch (error) {
    console.error("Error fetching users for deletion:", error);
    document.querySelector('.currentOpen').innerHTML = "<p>Data load failed. Please check your database connection.</p>";
  }
}


function displayUsersForDelete(users) {
  const container = document.querySelector('.currentOpen');
  container.innerHTML = ""; 

  if (users.length === 0) {
    container.innerHTML = "<p>No users found.</p>";
    return;
  }




  const table = document.createElement("table");
  table.border = "1";
  table.style.width = "100%";
  table.style.borderCollapse = "collapse";


  const thead = document.createElement("thead");
  thead.innerHTML = `
    <tr style="background-color: #f2f2f2;">
      <th style="padding: 10px;">Select</th>
      <th style="padding: 10px;">No.</th>
      <th style="padding: 10px;">ID</th>
      <th style="padding: 10px;">Name</th>
      <th style="padding: 10px;">Email</th>
      <th style="padding: 10px;">Role</th>
    </tr>
  `;
  table.appendChild(thead);

  // 表体
  const tbody = document.createElement("tbody");
  users.forEach((user, index) => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td style="padding: 10px; text-align: center;">
        <input type="checkbox" class="deleteCheckbox" 
               data-user-id="${user.id}" 
               data-user-role="${user.role}"
               data-auth-uid="${user.authUid}">
      </td>
      <td style="padding: 10px; text-align: center;">${index + 1}</td>
      <td style="padding: 10px;">${user.id}</td>
      <td style="padding: 10px;">${user.name}</td>
      <td style="padding: 10px;">${user.email}</td>
      <td style="padding: 10px;">${user.role}</td>
    `;
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  container.appendChild(table);

  const deleteBtn = document.createElement("button");
  deleteBtn.id = "deleteSelectedBtn";
  deleteBtn.textContent = "Delete Selected";
  deleteBtn.style.marginBottom = "10px";
  container.appendChild(deleteBtn);

  deleteBtn.addEventListener("click", async () => {
    const checkboxes = document.querySelectorAll(".deleteCheckbox:checked");
    const usersToDelete = [];
    const authUIDsToDelete = [];

    checkboxes.forEach(cb => {
      const userId = cb.getAttribute("data-user-id");
      const userRole = cb.getAttribute("data-user-role");
      const authUid = cb.getAttribute("data-auth-uid");
      usersToDelete.push({ id: userId, role: userRole });
      if (authUid) {
        authUIDsToDelete.push(authUid);
      }
    });

    if (usersToDelete.length === 0) {
      alert("No users selected for deletion.");
      return;
    }
    if (!confirm("Are you sure you want to delete the selected users?")) {
      return;
    }


    for (const userObj of usersToDelete) {
      let collectionName;
      if (userObj.role === "admin") {
        collectionName = "admin";
      } else if (userObj.role === "teacher") {
        collectionName = "lecturer"; 
      } else if (userObj.role === "student") {
        collectionName = "student";
      }
      try {
        await deleteDoc(doc(db, collectionName, userObj.id));
        console.log(`Deleted user ${userObj.id} from ${collectionName}`);
      } catch (error) {
        console.error("Error deleting Firestore document:", error);
      }
    }

const functions = getFunctions();
const deleteUsersFunction = httpsCallable(functions, 'deleteUsers');

    async function deleteSelectedUsers(authUIDsToDelete) {
  try {
    const result = await deleteUsersFunction({ uid: authUIDsToDelete });
    console.log("Delete users from Auth result:", result.data);
  } catch (error) {
    console.error("Error deleting Authentication accounts:", error);
  }
}
    await deleteSelectedUsers(authUIDsToDelete);
    alert("Selected users deleted.");
    
    fetchUsers();
  });
}

            <div class="nav-btn"> <p> Home  </p> </div>

        <p> Home</p>

        <p class="currentOpen-text">View User</p>

<script>
    document.addEventListener("DOMContentLoaded", function () {
    const homeBtn = document.querySelector(".nav-btn:nth-child(1)");
    const viewUserBtn = document.querySelector(".nav-btn:nth-child(2)"); // View User 按钮
    const dataAnalysisBtn = document.querySelector(".nav-btn:nth-child(3)"); // Data Analysis 按钮
    const dataSpace = document.querySelector(".dataSpace"); // 数据分析区域
    const functionSpace = document.querySelector(".functionSpace"); // 用户管理功能区域
    const homeSpace = document.querySelector(".homeSpace");

    // 初始状态：显示 Data Analysis，隐藏 functionSpace
    homeSpace.style.display = "block";
    dataSpace.style.display = "block";
    functionSpace.style.display = "block";


    // 点击 "View User" 按钮时
    viewUserBtn.addEventListener("click", function () {
        dataSpace.style.display = "none";  // 隐藏数据分析
        homeSpace.style.display = "none";
        functionSpace.style.display = "block"; // 显示用户管理功能
    });

    // 点击 "Data Analysis" 按钮时
    dataAnalysisBtn.addEventListener("click", function () {
        homeSpace.style.display="none";
        dataSpace.style.display = "block";  // 显示数据分析
        functionSpace.style.display = "none"; // 隐藏用户管理功能
    });

    homeBtn.addEventListener("click",function(){
        homeSpace.style.display="block";
        functionSpace.style.display = "block"; 
        dataSpace.style.display = "block";

    });
});

</script>
