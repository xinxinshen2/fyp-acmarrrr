<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student - View Announcements</title>
  <link rel="stylesheet" href="annstyles.css">
</head>
<body>
  <header>
    <h1>Student Dashboard</h1>
    <h2>Announcements</h2>
  </header>
  
  <section class="announcement-filters">
    <!-- Search bar and filter buttons -->
    <input type="text" id="search-bar" placeholder="Search announcements..." oninput="searchAnnouncements()">
    
    <!-- Buttons for filtering announcements -->
    <button onclick="handleButtonClick(this); filterAnnouncements('all')">Show All</button>
    <button onclick="handleButtonClick(this); filterAnnouncements('unread')">Unread</button>
    <button onclick="handleButtonClick(this); filterAnnouncements('read')">Read</button>
    
    <!-- Button to mark all announcements as read -->
    <button onclick="handleButtonClick(this); markAllAsRead()">Mark All as Read</button>
    
    <h3>Unread Announcements (<span id="unread-count">0</span>)</h3>
  </section>
  
  
  <section class="announcement-list">
    <!-- List of announcements -->
    <ul id="announcement-list"></ul>
  </section>

  <section id="comment-section" class="comment-section">
    <textarea id="comment-text" rows="2" cols="50" placeholder="Add a comment..."></textarea>
    <button onclick="postComment()">Post Comment</button>
  </section>

  <script src="student.js"></script>
</body>
</html>
