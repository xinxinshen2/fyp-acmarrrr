<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Attendance</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        #courseSelect {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #cameraContainer {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        #cameraPreview {
            display: block;
            width: 100%;
        }

        #scanOverlay {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 70%;
            height: 50%;
            border: 3px dashed rgba(255, 255, 255, 0.7);
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        #studentInfo {
            background-color: #fff;
            padding: 20px;
            margin-top: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: none; /* Initially hidden */
        }

        #studentInfo.success {
            background-color: #d4edda;
        }

        #studentInfo.error {
            background-color: #f8d7da;
        }

        #studentInfo h2 {
            margin-top: 0;
        }

        #attendanceButton {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <select id="courseSelect">
        <!-- Course options will be populated here -->
    </select>

    <div id="cameraContainer">
        <video id="cameraPreview"></video>
        <div id="scanOverlay"></div>
    </div>

    <div id="studentInfo">
        <h2 id="studentName"></h2>
        <p id="studentId"></p>
        <button id="attendanceButton">Mark Attendance</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <script>
        // Firebase configuration (replace with your actual config)
        const firebaseConfig = {
            apiKey: "REMOVED",
            authDomain: "advanceas-d8db4.firebaseapp.com",
            projectId: "advanceas-d8db4",
            storageBucket: "advanceas-d8db4.firebasestorage.app",
            messagingSenderId: "878892786344",
            appId: "1:878892786344:web:33bb5a97d99daf049d189d",
            measurementId: "G-PLRRKT6RWW"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const courseSelect = document.getElementById('courseSelect');
        const cameraPreview = document.getElementById('cameraPreview');
        const studentInfoDiv = document.getElementById('studentInfo');
        const studentName = document.getElementById('studentName');
        const studentId = document.getElementById('studentId');
        const attendanceButton = document.getElementById('attendanceButton');

        let selectedCourseId = null;
        let scanning = false;

        // Load courses
        async function loadCourses() {
            const coursesRef = db.collection("course");
            const coursesSnapshot = await coursesRef.get();

            coursesSnapshot.forEach(courseDoc => {
                const courseId = courseDoc.id;
                const courseData = courseDoc.data();
                const option = document.createElement('option');
                option.value = courseId;
                option.textContent = courseData.name; // Assuming courseData has a 'name' field
                courseSelect.appendChild(option);
            });
        }

        // Initialize camera
        async function initCamera() {
            // Comprehensive check for camera support
            if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
                let errorMessage = 'Camera access is not supported in this browser.';

                // Check if it's a protocol issue
                if (window.location.protocol !== 'https:') {
                    errorMessage = 'Camera access requires a secure (HTTPS) connection.';
                }

                alert(errorMessage);
                console.error(errorMessage);
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                cameraPreview.srcObject = stream;
                cameraPreview.setAttribute("playsinline", true);
                cameraPreview.play();
                scanning = true;
                requestAnimationFrame(scan);
            } catch (err) {
                console.error("Error accessing camera:", err);
                let alertMessage = "Failed to access camera. Please check permissions.";

                // More specific error messages
                if (err.name === "NotAllowedError") {
                    alertMessage = "Camera permission denied. Please enable it in your browser settings.";
                } else if (err.name === "NotFoundError") {
                    alertMessage = "No camera found. Please connect a camera and try again.";
                } else if (err.name === "NotReadableError") {
                    alertMessage = "Camera is already in use. Please close other applications using the camera.";
                }

                alert(alertMessage);
            }
        }

        // Scan function
        function scan() {
            if (!scanning) return;

            const canvasElement = document.createElement('canvas');
            const canvas = canvasElement.getContext("2d");

            canvasElement.width = cameraPreview.videoWidth;
            canvasElement.height = cameraPreview.videoHeight;
            canvas.drawImage(cameraPreview, 0, 0, canvasElement.width, canvasElement.height);

            const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
            });

            if (code) {
                console.log("Found QR code", code.data);
                findStudent(code.data);
                scanning = false;
            } else {
                requestAnimationFrame(scan);
            }
        }

        // Find student
        async function findStudent(studentIdScanned) {
            if (!selectedCourseId) {
                alert("Please select a course first.");
                return;
            }

            const studentsRef = db.collection("student");
            const studentQuery = await studentsRef.where("ID", "==", studentIdScanned).where("course", "==", selectedCourseId).get();

            if (!studentQuery.empty) {
                studentQuery.forEach(doc => {
                    const studentData = doc.data();
                    studentName.textContent = `Name: ${studentData.name}`;
                    studentId.textContent = `ID: ${studentData.ID}`;
                    studentInfoDiv.classList.remove('error');
                    studentInfoDiv.classList.add('success');
                    studentInfoDiv.style.display = 'block';

                    attendanceButton.onclick = () => markAttendance(doc.id);
                });
            } else {
                studentName.textContent = "Student not found in this course.";
                studentId.textContent = "";
                studentInfoDiv.classList.remove('success');
                studentInfoDiv.classList.add('error');
                studentInfoDiv.style.display = 'block';
            }
        }

        // Mark attendance
        async function markAttendance(studentId) {
            const now = new Date();
            const sessionDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const sessionStartTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const sessionId = `${sessionDate}_${sessionStartTime}_mobile`; // Unique session ID

            const attendanceRef = db.collection("attendance")
                .doc(selectedCourseId)
                .collection("mobile_sessions") // Using a general collection name
                .doc(sessionId)
                .collection("students")
                .doc(studentId);

            try {
                await attendanceRef.set({
                    status: 'present',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Attendance marked successfully!");
                studentInfoDiv.style.display = 'none';
                scanning = true;
                requestAnimationFrame(scan); // Restart scanning
            } catch (error) {
                console.error("Error marking attendance:", error);
                alert("Error marking attendance.");
            }
        }

        // Event listeners
        courseSelect.addEventListener('change', function() {
            selectedCourseId = this.value;
        });

        attendanceButton.addEventListener('click', function() {
            markAttendance();
        });

        // Show permission request on first load
        function showPermissionRequest() {
            if (localStorage.getItem('cameraPermissionRequested') !== 'true') {
                alert('This app needs camera access to scan student IDs. Please grant permission when prompted.');
                localStorage.setItem('cameraPermissionRequested', 'true');
            }
        }

        // Load courses and initialize camera on page load
        window.onload = async () => {
            showPermissionRequest();
            await loadCourses();
            await initCamera();
        };
    </script>
</body>
</html>
