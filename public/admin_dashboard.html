//LOGOUT HERE
    const logoutButton = document.getElementById("logoutButton");
    const progressRect = document.querySelector(".progress-ring-rect");
    let pressTimer;
    let progressInterval;

    const startProgress = () => {
        let time = 0;
        const totalTime = 3000; 
        const circumference = 284;

        progressInterval = setInterval(() => {
            time += 10; // Update every 10ms
            const progress = (time / totalTime) * circumference;
            progressRect.style.strokeDashoffset = circumference - progress;

            if (time >= totalTime) {
                clearInterval(progressInterval);
                logout(); 
            }
        }, 10);
    };

    const resetProgress = () => {
        clearInterval(progressInterval);
        progressRect.style.strokeDashoffset = 284; 
    };


    logoutButton.addEventListener("mousedown", startProgress);
    logoutButton.addEventListener("mouseup", resetProgress);
    logoutButton.addEventListener("mouseleave", resetProgress);


    logoutButton.addEventListener("touchstart", startProgress);
    logoutButton.addEventListener("touchend", resetProgress);

async function fetchUsers() {
    console.log("Current Filter Status:", filterState);
    userContainer.innerHTML = "<p>Loading...</p>";

    let users = [];

    try {

        const adminSnapshot = await getDocs(collection(db, "admin"));
        adminSnapshot.forEach(doc => {
            users.push({ id: doc.data().ID, name: doc.data().name, email: doc.data().email, role: "admin" });
        });


        const lecturerSnapshot = await getDocs(collection(db, "lecturer"));
        lecturerSnapshot.forEach(doc => {
            users.push({ id: doc.data().ID, name: doc.data().name, email: doc.data().email, role: "lecturer" });
        });


        const studentSnapshot = await getDocs(collection(db, "student"));
        studentSnapshot.forEach(doc => {
            // users.push({ id: doc.data().ID, name: doc.data().name, email: doc.data().email, role: "student" });
            users.push({ id: doc.data().ID, name: doc.data().name, email: doc.data().email, course: doc.data().course, group: doc.data().group, role: "student" });

        });


        let filteredUsers = users;
        if (filterState === "student") {
            filteredUsers = users.filter(user => user.role === "student");
        } else if (filterState === "lecturer") {
            filteredUsers = users.filter(user => user.role === "lecturer");
        }

        displayUsers(filteredUsers);

    } catch (error) {
        console.error("Error getting data:", error);
        userContainer.innerHTML = "<p>Data loading failed, please check the database connection.</p>";
    }
}

searchInput.addEventListener("input", (e) => {
  // Trim input and split by whitespace into tokens
  const query = e.target.value.trim().toLowerCase();
  const tokens = query.split(/\s+/).filter(token => token.length > 0);
  const rows = document.querySelectorAll(".currentOpen table tbody tr");

  rows.forEach(row => {
    const text = row.textContent.toLowerCase();
    // Check if every token is found in the row text
    const matchesAll = tokens.every(token => text.includes(token));
    row.style.display = matchesAll ? "table-row" : "none";
  });
});

document.getElementById("course").addEventListener("change", async (e) => {
  const selectedCourse = e.target.value;

  const role = document.getElementById("role").value;
  if (role !== "student") {
    return;
  }
  
try {
  if(role == "student"){
  const studentsQuery = query(
    collection(db, "student"),
    where("course", "==", selectedCourse)
  );
  const querySnapshot = await getDocs(studentsQuery);
  
  let maxId = 0;
  querySnapshot.forEach((docSnap) => {
    const currentId = parseInt(docSnap.id, 10);
    if (!isNaN(currentId) && currentId > maxId) {
      maxId = currentId;
    }
  });
  
  let newID = "";
  if (maxId === 0) {
    // If no student IDs are found, extract the digits from the course ID and append "0001"
    const courseDigitsMatch = selectedCourse.match(/\d+$/);
    if (courseDigitsMatch) {
      const courseDigits = courseDigitsMatch[0];
      newID = courseDigits + "0001";
    } else {
      newID = "0001"; // fallback if no digits found in course ID
    }
  } else {
    newID = (maxId + 1).toString();
  }
  
  console.log("New Student ID:", newID);
  document.getElementById("idDisplay").textContent = newID;
}

} catch (error) {
  console.error("Error in querying records:", error);
  alert("Error querying records, please check the console for details.");
}
});

function displayUsersForDelete(users) {
  const container = document.querySelector('.currentOpen');
  container.innerHTML = ""; 

  if (users.length === 0) {
    container.innerHTML = "<p>No users found.</p>";
    return;
  }




  const table = document.createElement("table");
  table.border = "1";
  table.style.borderCollapse = "collapse";
  table.id = "deleteTable";

  const thead = document.createElement("thead");
  thead.innerHTML = `
    <tr>
      <th >No.</th>
      <th >ID</th>
      <th >Name</th>
      <th >Email</th>
      <th >Role</th>
      <th >Select</th>
    </tr>
  `;
  table.appendChild(thead);

  
  const tbody = document.createElement("tbody");
  users.forEach((user, index) => {
    const row = document.createElement("tr");
    row.innerHTML = `
      
      <td style="padding: 10px; text-align: center;">${index + 1}</td>
      <td style="padding: 10px;">${user.id}</td>
      <td style="padding: 10px;">${user.name}</td>
      <td style="padding: 10px;">${user.email}</td>
      <td style="padding: 10px;">${user.role}</td>
      <td style="padding: 10px; text-align: center;">
        <input type="checkbox" class="deleteCheckbox" 
               data-user-id="${user.id}" 
               data-user-role="${user.role}"
               data-auth-uid="${user.authUid}">
      </td>
    `;
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  container.appendChild(table);

  const deleteBtn = document.createElement("button");
  deleteBtn.id = "deleteSelectedBtn";
  deleteBtn.textContent = "Delete Selected";
  deleteBtn.style.marginBottom = "10px";
  container.appendChild(deleteBtn);

  deleteBtn.addEventListener("click", async () => {
    const checkboxes = document.querySelectorAll(".deleteCheckbox:checked");
    const usersToDelete = [];
    const authUIDsToDelete = [];

    checkboxes.forEach(cb => {
        const userId = cb.getAttribute("data-user-id");
        const userRole = cb.getAttribute("data-user-role");
        const authUid = cb.getAttribute("data-auth-uid");
        usersToDelete.push({ id: userId, role: userRole });
        if (authUid) {
            authUIDsToDelete.push(authUid);
        }
    });

    if (usersToDelete.length === 0) {
        alert("No users selected for deletion.");
        return;
    }
    if (!confirm("Are you sure you want to delete the selected users?")) {
        return;
    }

    // delete the selected user from Firestore document
    for (const userObj of usersToDelete) {
        let collectionName;
        if (userObj.role === "admin") {
            collectionName = "admin";
        } else if (userObj.role === "teacher") {
            collectionName = "lecturer";
        } else if (userObj.role === "student") {
            collectionName = "student";
        }

        try {
            await deleteDoc(doc(db, collectionName, userObj.id));
            console.log(`Deleted user ${userObj.id} from ${collectionName}`);
        } catch (error) {
            console.error("Error deleting Firestore document:", error);
        }
    }

    try {
    const userCollectionRef = collection(db, "user");
    const userSnapshot = await getDocs(userCollectionRef); //read all document

    for (const docSnap of userSnapshot.docs) {
        const userData = docSnap.data(); 
        const docID = docSnap.id; 
        const userID = userData.ID; 

        if (usersToDelete.some(userObj => userObj.id === userID)) {
            try {
                await deleteDoc(doc(db, "user", userID)); 
                console.log(`Deleted user ${docID} with ID ${userID} from user collection`);
            } catch (error) {
                console.error("Error deleting Firestore document from user collection:", error);
            }
        }
    }
} catch (error) {
    console.error("Error retrieving users from user collection:", error);
}
    alert("Selected users deleted.");

    fetchUsers(); 
});
}

async function loadGroups(courseId) {
  const filterGroupContainer = document.querySelector(".filterGroup");
  try {
    const studentsQuerySnapshot = await getDocs(
      query(collection(db, "student"), where("course", "==", courseId))
    );
    const groupsSet = new Set();
    studentsQuerySnapshot.forEach(docSnap => {
      const data = docSnap.data();
      if (data.group) {
        groupsSet.add(data.group);
      }
    });
    const groups = Array.from(groupsSet).sort();
    let html = `<select id="groupSelect"><option value="">All Groups</option>`;
    groups.forEach(group => {
      html += `<option value="${group}">${group}</option>`;
    });
    html += `</select>`;
    filterGroupContainer.innerHTML = html;

    // Attach change event after the select is inserted
    document.getElementById("groupSelect").addEventListener("change", (e) => {
      selectedGroup = e.target.value;
      const selectedCourse = document.getElementById("courseSelect").value;
      if (selectedCourse) {
        loadTimetable(selectedCourse, selectedGroup);
      }
    });
  } catch (error) {
    console.error("Error loading groups: ", error);
    filterGroupContainer.innerHTML = "<p>Error loading groups.</p>";
  }
}

  async function loadTimetable(courseId,groupFilter = "") {

    const sessionsByDay = {
      Monday: [],
      Tuesday: [],
      Wednesday: [],
      Thursday: [],
      Friday: [],
      Saturday: [],
      Sunday: []
    };

    try {
      const courseDocRef = doc(db, "course", courseId);
      const subjectSnapshot = await getDocs(collection(courseDocRef, "subject"));

      subjectSnapshot.forEach(subDoc => {
      const subjectData = subDoc.data();
      if (subjectData.sessions && Array.isArray(subjectData.sessions)) {
        subjectData.sessions.forEach(session => {
          if (sessionsByDay[session.day]) {
            if (groupFilter && session.group && session.group !== groupFilter) {
            } else {
              sessionsByDay[session.day].push({
                subjectName: subjectData.name,
                class: session.class,
                lecturerID: session.lectureID,
                startTime: session.startTime,
                endTime: session.endTime,
                type: session.type,
                group: session.group || ""
              });
            }
          }
        });
      }
    });

      // 对每一天的 sessions 按 startTime 从早到晚排序
      for (const day in sessionsByDay) {
        sessionsByDay[day].sort((a, b) => a.startTime.localeCompare(b.startTime));
      }

      // 渲染 timetable 表格
      renderTimetable(sessionsByDay);
    } catch (error) {
      console.error("Error loading timetable: ", error);
      document.querySelector(".tableDisplay").innerHTML = "<p>Error loading timetable.</p>";
    }
  }

    let html = "<table style='width: 100%; border-collapse: collapse; table-layout: fixed;'>"; //border-spacing: 0;
    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    days.forEach(day => {
      html += `<tr style="border: 1px solid #ccc;">`;
      html += `<td style="padding: 8px; border: 1px solid #ccc; font-weight: bold; background: #f2f2f2; width: 15%; text-align: center; vertical-align: middle;">${day}</td>`;

                vertical-align: top;

function formatTime(timeStr) {
  let [hours, minutes] = timeStr.split(':');
  hours = parseInt(hours, 10);
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12;
  if (hours === 0) hours = 12;
  return `${hours}:${minutes} ${ampm}`;
}

// Helper: Parse a "YYYY-MM-DD" string into a Date object.
function parseDate(dateStr) {
  return new Date(dateStr + "T00:00:00");
}

// Helper: Calculate maximum consecutive days from an array of date strings.
function getMaxConsecutiveDays(dateStrArray) {
  if (dateStrArray.length === 0) return 0;
  
  // 先去重并排序
  const uniqueDates = [...new Set(dateStrArray.map(parseDate))].sort((a, b) => a - b);
  let maxStreak = 1, currentStreak = 1;

  for (let i = 1; i < uniqueDates.length; i++) {
    const diff = (uniqueDates[i] - uniqueDates[i - 1]) / (1000 * 60 * 60 * 24);
    
    if (diff === 1) {
      currentStreak++;
    } else {
      currentStreak = 1;
    }
    maxStreak = Math.max(maxStreak, currentStreak);
  }
  return maxStreak;
}

function attachTableEventListeners(alerts, tableHTML) {
  const displayContainer = document.querySelector(".displayAnalysis");

  document.querySelectorAll(".viewDetailsBtn").forEach(btn => {
  btn.addEventListener("click", (e) => {
    const studentId = e.target.getAttribute("data-student");
    const alertItem = alerts.find(a => a.studentId === studentId);

    if (alertItem && alertItem.details.length > 0) {
      showDetail(alertItem, displayContainer, alerts, tableHTML);
    }
    });
  });


  // Attach event listener for the "Send Alert" button.
  document.getElementById("sendAlert-btn").addEventListener("click", async () => {
  const checkedBoxes = document.querySelectorAll(".alertCheckbox:checked");
  const mailtoLinks = [];

  for (const checkbox of checkedBoxes) {
    const studentId = checkbox.value;
    const alertItem = alerts.find(a => a.studentId === studentId);

    if (alertItem) {
      const studentDocSnap = await getDoc(doc(db, "student", studentId));
      if (studentDocSnap.exists()) {
        const studentInfo = studentDocSnap.data();
        const emailAddress = studentInfo.email;
        const emailSubject = `Absence Alert for ${studentId}`;
        const emailMessage = `Dear Student ${studentId},\n\n` +
          `Our records indicate that you have been absent for ${alertItem.consecutiveDays} consecutive days in course ${alertItem.course}.\n` +
          `Group: ${alertItem.group}\n` +
          `Details:\n` +
          alertItem.details.map(d => `${d.subject} on ${d.date} at ${d.time} (${d.classType})`).join("\n") +
          `\n\nPlease contact your instructor if you have any questions.\n\nRegards,\nAttendance Team`;

        const mailtoLink = `mailto:${encodeURIComponent(emailAddress)}?subject=${encodeURIComponent(emailSubject)}&body=${encodeURIComponent(emailMessage)}`;
        mailtoLinks.push(mailtoLink);
      }
    }
  }

  if (mailtoLinks.length === 0) {
    alert("No student was selected or the corresponding email address was not found.");
    return;
  }

   mailtoLinks.forEach((link, index) => {
    setTimeout(() => {
      window.open(link, "_blank");
    }, index * 1000); 
  });

  setTimeout(() => {
    alert("All emails have been popped up, please check your email client!");
  }, mailtoLinks.length * 1000 + 500);
});





}

function showDetail(alertItem, displayContainer, alerts, tableHTML) {
      let detailsHTML = `<div id="detailsView" style="cursor: pointer; padding: 10px;">
        <h3 style="padding:10px;">Details for Student ${alertItem.studentId}</h3> 
        <div class="dataShowDetail" style="text-align:center; padding-top:30px; font-size:larger;">`;
        
      alertItem.details.forEach((d, index) => {
        detailsHTML += `<hr><br><p>
          <strong>Subject:</strong> ${d.subject}<br>
          <strong>Date:</strong> ${d.date}<br>
          <strong>Time:</strong> ${d.time}<br>
          <strong>LecturerID:</strong> ${d.lecturerID}<br>
          <strong>Class Type:</strong> ${d.classType}<br>
        </p><br><hr>`;
      });
    
      detailsHTML += `</div><br><br>
        <p style="text-align:center;"><em>Tap to go back</em></p>
      </div>`;
    
      displayContainer.innerHTML = detailsHTML;
    
      document.getElementById("detailsView").addEventListener("click", () => {
        displayContainer.innerHTML = tableHTML; 
        attachTableEventListeners(alerts, tableHTML);
      });
    }


// Function to load attendance courses into the select element.
async function loadAttendanceCourses() {
  const courseContainer = document.querySelector(".selectCourseAttend");
  try {
    // Query the "attendance" collection to get all course document IDs.
    const attendanceSnapshot = await getDocs(collection(db, "attendance"));
    
    // Build a select element.
    let html = `<select id="attendanceCourseSelect">
                  <option value="">Choose Course</option>`;
    attendanceSnapshot.forEach(docSnap => {
      const courseIDattend = docSnap.id;
      html += `<option value="${courseIDattend}">${courseIDattend}</option>`;
    });
    html += `</select>`;
    courseContainer.innerHTML = html;
    
    // Attach a change event listener to call analyzeAttendance.
    document.getElementById("attendanceCourseSelect").addEventListener("change", (e) => {
      const selectedCourse = e.target.value;
      console.log("Course selected:", selectedCourse);
      if (selectedCourse) {
        analyzeAttendance(selectedCourse);
      } else {
        // Clear analysis display if no course is selected.
        document.querySelector(".displayAnalysis").innerHTML = "";
      }
    });
  } catch (error) {
    console.error("Error loading attendance courses:", error);
    courseContainer.innerHTML = "<p>Error loading courses.</p>";
  }
}

// Load courses when the DOM is ready.
document.addEventListener("DOMContentLoaded", () => {
  loadAttendanceCourses();
});
