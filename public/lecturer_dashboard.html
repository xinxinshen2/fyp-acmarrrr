    <script type="module">
        // 导入Firebase所需的模块 - 确保包含setDoc
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            getDocs, 
            doc, 
            getDoc, 
            updateDoc, 
            setDoc,  
            arrayUnion, 
            arrayRemove,
            query,
            where,
            onSnapshot,
            writeBatch,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "REMOVED",
            authDomain: "advanceas-d8db4.firebaseapp.com",
            databaseURL: "https://advanceas-d8db4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "advanceas-d8db4",
            storageBucket: "advanceas-d8db4.firebasestorage.app",
            messagingSenderId: "878892786344",
            appId: "1:878892786344:web:33bb5a97d99daf049d189d",
            measurementId: "G-PLRRKT6RWW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        async function loadLecturerName() {
            const lectureID = sessionStorage.getItem('lectureID');
            console.log("Lecture ID from session:", lectureID); // Debugging line
            if (!lectureID) {
                console.error("Lecture ID not found in session.");
                window.location.href = 'login.html'; // Redirect to login if lectureID is not found
                return;
            }

            const lecturerRef = doc(db, "lecturer", lectureID);
            const lecturerDoc = await getDoc(lecturerRef);

            if (lecturerDoc.exists()) {
                const lecturerData = lecturerDoc.data();
                console.log("Lecturer data retrieved:", lecturerData); // Debugging line
                document.getElementById('lecturerName').textContent = lecturerData.name;
            } else {
                console.error("No such document!");
            }
        }

        // Load total classes count
        async function loadTotalClasses() {
            const lectureID = sessionStorage.getItem('lectureID');
            if (!lectureID) {
                console.error("No lecturer ID found");
                return;
            }

            try {
                let totalCount = 0;
                const coursesSnapshot = await getDocs(collection(db, "course"));
                
                for (const courseDoc of coursesSnapshot.docs) {
                    const courseId = courseDoc.id;
                    const courseData = courseDoc.data();
                    const expiryDate = courseData.subjectExpiry?.toDate(); // Convert Firebase timestamp
                    
                    // Skip expired courses
                    if (expiryDate && expiryDate < new Date()) {
                        console.log(`Skipping expired course for total count: ${courseId}`);
                        continue;
                    }
                    
                    const subjectsSnapshot = await getDocs(collection(db, "course", courseId, "subject"));
                    
                    for (const subjectDoc of subjectsSnapshot.docs) {
                        const subjectData = subjectDoc.data();
                        const sessions = subjectData.sessions || [];
                        
                        // Count sessions assigned to this lecturer
                        const lecturerSessions = sessions.filter(session => session.lectureID === lectureID);
                        totalCount += lecturerSessions.length;
                    }
                }
                
                // Update the display
                document.getElementById('totalClassesCount').textContent = totalCount;
            } catch (error) {
                console.error("Error loading total classes:", error);
                document.getElementById('totalClassesCount').textContent = 'Error';
            }
        }

        // 加载缺席申请统计
        async function loadAbsenceStatistics() {
            const lectureID = sessionStorage.getItem('lectureID');
            if (!lectureID) {
                console.error("No lecturer ID found");
                return;
            }

            try {
                const notificationRef = doc(db, "notifications", lectureID);
                const notificationDoc = await getDoc(notificationRef);
                
                if (notificationDoc.exists()) {
                    const absenceRequests = notificationDoc.data().absenceRequests || [];
                    
                    // 计算待处理、已批准和已拒绝的请求数量
                    const pendingCount = absenceRequests.filter(req => req.status === "pending").length;
                    const approvedCount = absenceRequests.filter(req => req.status === "approved").length;
                    const rejectedCount = absenceRequests.filter(req => req.status === "rejected").length;
                    
                    // 更新统计数字
                    document.getElementById('pendingRequestsCount').textContent = pendingCount;
                    document.getElementById('approvedLeavesCount').textContent = approvedCount;
                    document.getElementById('rejectedLeavesCount').textContent = rejectedCount;
                } else {
                    // 如果没有通知文档，则所有计数为0
                    document.getElementById('pendingRequestsCount').textContent = '0';
                    document.getElementById('approvedLeavesCount').textContent = '0';
                    document.getElementById('rejectedLeavesCount').textContent = '0';
                }
            } catch (error) {
                console.error("Error loading absence statistics:", error);
            }
        }

        // 加载缺席申请详情
        async function loadAbsenceRequests() {
            const pendingRequestsDiv = document.getElementById("pendingRequests");
            pendingRequestsDiv.innerHTML = '<p class="loading">Loading requests...</p>';
            
            const lectureID = sessionStorage.getItem('lectureID');
            if (!lectureID) {
                pendingRequestsDiv.innerHTML = '<p class="error">Teacher ID not found</p>';
                return;
            }
            
            try {
                const notificationRef = doc(db, "notifications", lectureID);
                const notificationDoc = await getDoc(notificationRef);
                
                if (!notificationDoc.exists() || !notificationDoc.data().absenceRequests || notificationDoc.data().absenceRequests.length === 0) {
                    pendingRequestsDiv.innerHTML = '<p class="no-data">No pending absence requests</p>';
                    return;
                }
                
                const absenceRequests = notificationDoc.data().absenceRequests;
                const pendingRequests = absenceRequests.filter(req => req.status === "pending");
                
                if (pendingRequests.length === 0) {
                    pendingRequestsDiv.innerHTML = '<p class="no-data">No pending absence requests</p>';
                    return;
                }
                
                // 按学生ID分组请求
                const requestsByStudent = {};
                pendingRequests.forEach(request => {
                    if (!requestsByStudent[request.studentId]) {
                        requestsByStudent[request.studentId] = [];
                    }
                    requestsByStudent[request.studentId].push(request);
                });
                
                let requestsHTML = '<div class="requests-list">';
                
                // 遍历每个学生的请求
                for (const [studentId, requests] of Object.entries(requestsByStudent)) {
                    // 使用第一个请求获取学生信息
                    const firstRequest = requests[0];
                    const submittedDate = firstRequest.submittedAt ? new Date(firstRequest.submittedAt.toDate()).toLocaleString() : 'Unknown date';
                    
                    requestsHTML += `
                        <div class="request-card">
                            <div class="request-header">
                                <h3>${firstRequest.studentName} (${firstRequest.studentId})</h3>
                                <span class="request-date">Submitted: ${submittedDate}</span>
                            </div>
                            <div class="request-details">
                                <p><strong>Reason:</strong> ${firstRequest.reason}</p>
                                ${firstRequest.file ? `<p><strong>Supporting Document:</strong> <a href="${firstRequest.file}" target="_blank">View Document</a></p>` : ''}
                                <p><strong>Affected Sessions:</strong></p>
                                <ul class="sessions-list">
                    `;
                    
                    // 列出所有受影响的课程
                    requests.forEach(request => {
                        requestsHTML += `
                            <li>
                                <input type="checkbox" class="session-checkbox" 
                                       data-student="${request.studentId}" 
                                       data-course="${request.courseCode}" 
                                       data-subject="${request.subjectId}" 
                                       data-session="${request.sessionId}" 
                                       data-reason="${request.reason}" 
                                       data-date="${request.date || ''}"
                                       data-time="${request.startTime || ''}"
                                       checked>
                                <span class="session-detail-text">
                                    <strong>${request.date || 'Unknown date'}</strong>: 
                                    ${request.courseCode} - ${request.subjectId}
                                    (${request.startTime || 'N/A'} - ${request.endTime || 'N/A'})
                                </span>
                            </li>
                        `;
                    });
                    
                    requestsHTML += `
                                </ul>
                            </div>
                            <div class="absence-type-selection" style="display:none;">
                                <p><strong>Select Absence Type:</strong></p>
                                <div class="absence-types">
                                    <label>
                                        <input type="radio" name="absenceType_${studentId}" value="MC" checked> 
                                        MC <span class="type-desc">(Medical Certificate - Student was ill and has medical proof)</span>
                                    </label>
                                    <label>
                                        <input type="radio" name="absenceType_${studentId}" value="FE"> 
                                        FE <span class="type-desc">(Family Emergency - Student had an urgent family matter)</span>
                                    </label>
                                    <label>
                                        <input type="radio" name="absenceType_${studentId}" value="PA"> 
                                        PA <span class="type-desc">(Pre-Approved - Student's absence was approved in advance)</span>

async function matchStudentAndRecordAttendance(subjectId, venue, course, group) {
    console.log(`📡 Checking attendance for venue: ${venue}`);

    const tempStudentRef = doc(db, "ESP32", venue);
    const tempStudentDoc = await getDoc(tempStudentRef);

    if (!tempStudentDoc.exists()) {
        console.error(` No data found for venue: ${venue}`);
        return;
    }

    const tempStudentData = tempStudentDoc.data();
    const studentUIDs = tempStudentData.tempStudent || [];

    if (studentUIDs.length === 0) {
        console.warn(" No students detected in NFC tempStudent list");
        return;
    }

    console.log(" NFC Read UIDs:", studentUIDs);

    const studentsRef = collection(db, "student");
    const q = query(studentsRef, where("UID", "in", studentUIDs));
    const querySnapshot = await getDocs(q);

    let matchedStudents = [];
    let invalidStudents = [];
    let unknownUIDs = [...studentUIDs]; 

    querySnapshot.forEach((doc) => {
        const data = doc.data();
        const uidIndex = unknownUIDs.indexOf(data.UID);
        if (uidIndex > -1) {
            unknownUIDs.splice(uidIndex, 1); 
        }
        if(group === "all"){
            if(data.course === course){
                matchedStudents.push({
                id: doc.id,
                name: data.name,
                course: data.course,
                group: data.group,
                uid: data.UID
            });
            }
        }else if(data.group === group) {
            if(data.course === course){
                matchedStudents.push({
                id: doc.id,
                name: data.name,
                course: data.course,
                group: data.group,
                uid: data.UID
            });
            }
        } else {
            invalidStudents.push({
                studentId: doc.id,
                uid: data.UID,
                name: data.name,
                course: data.course,
                group: data.group
            });
        }
    });



    console.log(" Matched Students:", matchedStudents);
    console.log(" Invalid Students:", invalidStudents);
    console.log(" Unknown UIDs:", unknownUIDs);

    let studentRecords = [];
    
    matchedStudents.forEach(student => {
        studentRecords.push({
            uid: student.uid,
            studentId: student.id,
            courseId: student.course,
            subjectId: subjectId,
            status: "present"
        });
    });

    invalidStudents.forEach(student => {
        studentRecords.push({
            uid: student.uid,
            studentId: student.studentId,
            courseId: student.course,
            subjectId: subjectId,
            status: "invalid"  // 课程或小组不匹配
        });
    });

    unknownUIDs.forEach(uid => {
        studentRecords.push({
            uid: uid,
            studentId: null,
            courseId: null,
            subjectId: subjectId,
            status: "unknown"  // UID 没有对应的学生
        });
    });
    return studentRecords; 

    console.log(" studentRecords(M):", studentRecords);

    alert(`Attendance updated: ${matchedStudents.length} present, ${invalidStudents.length} invalid, ${unknownUIDs.length} unknown.`);
}

async function saveAttendanceToFirestore(subjectId, courseId, group, studentRecords) {
    if (!studentRecords || studentRecords.length === 0) {
        console.error(" No student records to process.");
        return;
    }

    const sessionId = sessionStorage.getItem("sessionId");
    if (!sessionId) {
        console.error(" Session ID not found");
        alert(" Unable to save attendance, Session ID missing");
        return;
    }

    if (!courseId || !subjectId || !sessionId) {
        console.error(" Missing Firestore path parameters!", { courseId, subjectId, sessionId });
        alert(" Unable to save attendance, Missing required parameters");
        return;
    }

    console.log("Current Session ID:", sessionId);

    const sessionRef = doc(db, `attendance/${courseId}/${subjectId}/${sessionId}`);
    const sessionDoc = await getDoc(sessionRef);

    //  如果 sessionId 还不存在，先创建 session 文档
    if (!sessionDoc.exists()) {
        await setDoc(sessionRef, {
            createdAt: serverTimestamp(),
            status: "active"
        });
        console.log(`✅ Subject ${courseId} - ${subjectId} - ${sessionId} Created!!!`);
    }

    // 1️ 查询该课程的所有学生
    let studentsQuery;
    if (group === "all") {
        studentsQuery = query(collection(db, "student"), where("course", "==", courseId));
    } else {
        studentsQuery = query(collection(db, "student"), 
            where("course", "==", courseId),
            where("group", "==", group)
        );
    }

    const studentsSnapshot = await getDocs(studentsQuery);
    if (studentsSnapshot.empty) {
        console.warn(`⚠️ No students found for Course: ${courseId}, Group: ${group}`);
        alert("⚠️ No matching students found.");
        return;
    }

    const batch = writeBatch(db);

    // 2️ 先默认将所有学生设为 "absent"
    studentsSnapshot.forEach(docSnap => {
        const student = docSnap.data();
        const studentId = docSnap.id;

        const studentDocRef = doc(db, `attendance/${courseId}/${subjectId}/${sessionId}/students`, studentId);
        batch.set(studentDocRef, {
            uid: student.uid || "unknown",
            status: "absent",
            timestamp: serverTimestamp()
        }, { merge: true });
    });

    // 3️ 然后遍历 studentRecords，将 "present" 的学生更新
    studentRecords.forEach(record => {
        if (!record.studentId || !record.uid) {
            console.error("⚠️ Skipping invalid student record:", record);
            return;
        }

        const studentDocRef = doc(db, `attendance/${courseId}/${subjectId}/${sessionId}/students`, record.studentId);
        batch.set(studentDocRef, {
            uid: record.uid,
            status: "present",
            timestamp: serverTimestamp()
        }, { merge: true });
    });

    try {
        await batch.commit();
        alert(` Student attendance records have been saved\n Course: ${courseId}\n Subject: ${subjectId}\n Session: ${sessionId}`);
        console.log("✅ Attendance successfully saved to Firestore!");
    } catch (error) {
        console.error(" Failed to save attendance:", error);
        alert(" Error saving attendance: " + error.message);
    }
}


window.toggleNFC = async function(subjectId, course, group, startTime, endTime, sessionDay, sessionDate, sessionType, venue) {
    const enable = document.getElementById('nfcSwitch').checked;
    console.log("📡 toggleNFC trigger", enable);

    const todayIndex = new Date().getDay();
    const daysOfWeek = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const todayName = daysOfWeek[todayIndex];

    console.log(` Today is: ${todayName}, class is scheduled on: ${sessionDay}`);

    if (todayName !== sessionDay) {

        document.getElementById('nfcSwitch').checked = false;
        return;
    }

    const lectureID = sessionStorage.getItem('lectureID');
    const tempStudentRef = doc(db, "ESP32", venue);

    try {
        if (enable) {
            if (unsubscribeAttendance) {
                console.warn(" Already monitoring attendance, skipping duplicate listener.");
                return;
            }

            console.log("🗑️ Clearing tempStudent before monitoring...");
            await setDoc(tempStudentRef, {

            if (unsubscribeAttendance) {
                unsubscribeAttendance();
                unsubscribeAttendance = null;
                processedUIDs.clear();
             
            }

            await setDoc(tempStudentRef, { status: false }, { merge: true });

                alert(" No student data found!");
            }
            document.getElementById('nfcSwitch').checked = false;
            alert(" NFC Reader is closed");
        }
    } catch (error) {
        console.error(" Error updating Firestore:", error);
        alert(" Failed to update NFC status in Firestore");
        document.getElementById('nfcSwitch').checked = false;
    }
};

async function processAttendance(subjectId, venue, course, group) {
    let studentRecords = await matchStudentAndRecordAttendance(subjectId, venue, course, group);

    if (group !== "all") {
        studentRecords = studentRecords.filter(student => student.group === group);
    }

    //  Remove invalid student records (null studentId or courseId)
    studentRecords = studentRecords.filter(record => record.studentId && record.courseId);

    if (studentRecords.length > 0) {
        await saveAttendanceToFirestore(subjectId, course, group, studentRecords);
    } else {
        console.warn(" No valid student records found for attendance.");
    }
}





let unsubscribeAttendance = null; // 用于存储 Firestore 监听实例
let processedUIDs = new Set(); // To track already processed student UIDs

function startMonitoringAttendance(venue, subjectId, course, group) {
    console.log(` Listening for NFC data at venue: ${venue}...`);

    const tempStudentRef = doc(db, "ESP32", venue);

    if (unsubscribeAttendance) {
        console.warn(" Stopping previous Firestore listener...");
        unsubscribeAttendance();
        unsubscribeAttendance = null;
        processedUIDs.clear(); 
    }
    
    unsubscribeAttendance = onSnapshot(tempStudentRef, async (docSnap) => {
        if (!docSnap.exists()) {
            console.warn(` No data found for venue: ${venue}`);
            return;
        }

        const tempStudentData = docSnap.data();
        let studentUIDs = tempStudentData.tempStudent || [];

        // Remove duplicates
        studentUIDs = [...new Set(studentUIDs)];

        // Identify new UIDs that haven't been processed
        let newUIDs = studentUIDs.filter(uid => !processedUIDs.has(uid));

        if (newUIDs.length === 0) {
            console.log(" No new NFC UIDs detected, waiting for data...");
            return;
        }

        console.log(" New NFC Read UIDs:", newUIDs);

        // Query Firestore for new UIDs
        const studentsRef = collection(db, "student");
        const q = query(studentsRef, where("UID", "in", newUIDs));
        const querySnapshot = await getDocs(q);

        let matchedStudents = [];
        let unknownUIDs = new Set(newUIDs);

        querySnapshot.forEach((doc) => {
            const data = doc.data();
            unknownUIDs.delete(data.UID);

            matchedStudents.push({
                id: doc.id,
                name: data.name,
                course: data.course,
                group: data.group,
                uid: data.UID,
                status: "present"
            });
        });

        let unknownStudents = [...unknownUIDs].map(uid => ({
            id: "N/A",
            name: "Unknown",
            course: "N/A",
            group: "N/A",
            uid: uid,
            status: "unknown"
        }));

        let allStudents = [...matchedStudents, ...unknownStudents];

        console.log(" New Attendance Data:", allStudents);
        updateUI(allStudents);

        // Add new UIDs to the processed set
        newUIDs.forEach(uid => processedUIDs.add(uid));
    });
}

    // 批准所有缺席申请
    window.approveAllAbsences = async function(studentId) {
        console.log("开始处理批准申请:", studentId);
        
        try {
            const lectureID = sessionStorage.getItem('lectureID');
            console.log("当前讲师ID:", lectureID);
            
            // 获取选中的缺席类型
            const radioSelector = `input[name="absenceType_${studentId}"]:checked`;
            const selectedRadio = document.querySelector(radioSelector);
            
            if (!selectedRadio) {
                console.error("找不到选中的缺席类型:", radioSelector);
                alert("Please select an absence type");
                return;
            }
            
            const absenceTypeValue = selectedRadio.value;
            console.log("选中的缺席类型:", absenceTypeValue);
            
            const absenceTypeMap = {
                'MC': 'Medical Certificate - Student was ill and has medical proof',
                'FE': 'Family Emergency - Student had an urgent family matter',
                'PA': 'Pre-Approved - Student\'s absence was approved in advance',
                'MH': 'Mental Health - Student needed a mental health day'
            };
            const absenceTypeText = `${absenceTypeValue}: ${absenceTypeMap[absenceTypeValue]}`;
            
            // 获取所有选中的会话
            const checkboxes = document.querySelectorAll(`.session-checkbox[data-student="${studentId}"]:checked`);
            console.log("选中的会话数量:", checkboxes.length);
            
            if (checkboxes.length === 0) {
                alert("Please select at least one session");
                return;
            }
            
            // 构建要处理的会话列表
            const sessionsToProcess = [];
            checkboxes.forEach(checkbox => {
                sessionsToProcess.push({
                    studentId: checkbox.dataset.student,
                    courseCode: checkbox.dataset.course,
                    subjectId: checkbox.dataset.subject,
                    sessionId: checkbox.dataset.session,
                    date: checkbox.dataset.date,
                    time: checkbox.dataset.time,
                    reason: checkbox.dataset.reason
                });
            });
            
            // 创建确认消息
            let confirmMessage = `You are about to approve ${checkboxes.length} absence request(s) with type ${absenceTypeValue}.\n\n`;
            confirmMessage += "Sessions to approve:\n";
            sessionsToProcess.forEach((session, index) => {
                confirmMessage += `${index + 1}. ${session.courseCode}: ${session.date} (${session.time})\n`;
            });
            confirmMessage += "\nProceed with approval?";
            
            if (!confirm(confirmMessage)) {
                return;
            }
            
            // 1. 更新通知状态 - 保留文件信息
            const notificationRef = doc(db, "notifications", lectureID);
            const notificationDoc = await getDoc(notificationRef);
            
            if (notificationDoc.exists()) {
                const absenceRequests = notificationDoc.data().absenceRequests || [];
                console.log("原有请求数量:", absenceRequests.length);
                
                const updatedRequests = absenceRequests.map(req => {
                    // 只更新选中的会话
                    const matchingSession = sessionsToProcess.find(session => 
                        session.studentId === req.studentId &&
                        session.courseCode === req.courseCode &&
                        session.subjectId === req.subjectId &&
                        session.sessionId === req.sessionId
                    );
                    
                    if (matchingSession && req.status === "pending") {
                        console.log("更新请求状态:", req.sessionId);
                        return { 
                            ...req, 
                            status: "approved", 
                            absenceType: absenceTypeValue, 
                            absenceTypeText: absenceTypeText,
                            approvedAt: new Date()  // 添加批准时间
                        };
                    }
                    return req;
                });
                
                await updateDoc(notificationRef, { absenceRequests: updatedRequests });
                console.log("通知状态已更新");
            }
            
            // 2. 更新学生的缺席申请状态 - 保留文件信息
            // 按课程和组分组处理以减少数据库调用
            const studentGroupsMap = {};
            for (const session of sessionsToProcess) {
                const studentId = session.studentId;
                if (!studentGroupsMap[studentId]) {
                    // 获取学生信息
                    const studentRef = doc(db, "student", studentId);
                    const studentDoc = await getDoc(studentRef);
                    if (studentDoc.exists()) {
                        const studentData = studentDoc.data();
                        studentGroupsMap[studentId] = studentData.group;
                    }
                }
            }

            const sessionsByGroup = {};
            sessionsToProcess.forEach(session => {
                const studentGroup = studentGroupsMap[session.studentId] || "unknown";
                const groupKey = `${session.courseCode}_${studentGroup}_${session.studentId}`;
                if (!sessionsByGroup[groupKey]) {
                    sessionsByGroup[groupKey] = {
                        course: session.courseCode,
                        group: studentGroup, // 使用从学生数据获取的正确组信息
                        student: session.studentId,
                        sessions: []
                    };
                }
                sessionsByGroup[groupKey].sessions.push(session);
            });
            
            for (const groupKey in sessionsByGroup) {
                const { course, group, student, sessions } = sessionsByGroup[groupKey];
                
                const absenceRef = doc(db, "absence", course, group, student);
                const absenceDoc = await getDoc(absenceRef);
                
                if (absenceDoc.exists()) {
                    const forms = absenceDoc.data().Form || [];
                    const updatedForms = forms.map(form => {
                        // 保留文件上传信息
                        const fileLink = form.fileLink || "";
                        
                        const updatedSessions = (form.missedSessions || []).map(s => {
                            // 检查这个session是否在我们要批准的列表中
                            const shouldApprove = sessions.some(session => 
                                session.sessionId === s.sessionId
                            );
                            
                            if (shouldApprove) {
                                return { 
                                    ...s, 
                                    status: "approved", 
                                    absenceType: absenceTypeValue, 
                                    absenceTypeText: absenceTypeText,
                                    approvedBy: lectureID,
                                    approvedAt: new Date()
                                };
                            }
                            return s;
                        });
                        
                        return { 
                            ...form, 
                            missedSessions: updatedSessions,
                            fileLink: fileLink,  // 确保保留文件链接
                            status: updatedSessions.every(s => s.status !== "pending") ? "processed" : form.status
                        };
                    });
                    
                    await updateDoc(absenceRef, { Form: updatedForms });
                    console.log(`已更新学生缺席申请状态: ${course}/${group}/${student}`);
                }
            }
            
            // 3. 在attendance记录中创建缺席记录 - 只为选中的会话创建记录
            let createdRecords = 0;
            const failedRecords = [];
            
            for (const session of sessionsToProcess) {
                try {
                    const { courseCode, subjectId, sessionId, studentId } = session;
                    
                    // 直接使用原始会话ID，不尝试解析和重建
                    console.log(`使用原始会话ID: ${sessionId}，分析部分: ${sessionId.split('_').join(', ')}`);
                    
                    // 创建对学生文档的引用
                    const studentAttendanceRef = doc(db, 
                        "attendance", courseCode, 
                        subjectId, sessionId, 
                        "students", studentId
                    );
                    
                    // 准备学生的缺席记录数据
                    const studentRecord = {
                        status: "approved_absence",  // 修改为approved_absence而不是absent
                        method: "absence_request_approved",  // 修改为absence_request_approved
                        timestamp: new Date(),      // 时间戳
                        reason: absenceTypeValue,   // 缺席类型代码
                        approvedBy: lectureID,      // 批准人
                        approvedAt: new Date()      // 批准时间
                    };
                    
                    // 创建或更新学生的出勤记录
                    await setDoc(studentAttendanceRef, studentRecord);
                    createdRecords++;
                    
                    console.log(`已创建/更新出勤记录: attendance/${courseCode}/${subjectId}/${sessionId}/students/${studentId}`);
                    
                } catch (error) {
                    console.error(`创建出勤记录失败，会话信息:`, session, `错误:`, error);
                    failedRecords.push(session);
                }
            }
            
            if (failedRecords.length > 0) {
                console.warn(`${failedRecords.length} 条记录创建失败:`, failedRecords);
                alert(`Successfully approved ${createdRecords} sessions, but ${failedRecords.length} failed. See console for details.`);
            } else {
                alert(`Successfully approved all ${createdRecords} absence requests.`);
            }
            
            loadAbsenceRequests(); // 重新加载列表
            loadAbsenceStatistics(); // 更新统计数据
            
        } catch (error) {
            console.error("批准缺席申请失败:", error);
            alert("Error: " + error.message);
        }
    }

    // 拒绝所有缺席申请
    window.rejectAllAbsences = async function(studentId) {
        if (!confirm("Are you sure you want to reject all absence requests from this student?")) {
            return;
        }
        
        try {
            const lectureID = sessionStorage.getItem('lectureID');
            
            // 获取所有选中的会话
            const checkboxes = document.querySelectorAll(`.session-checkbox[data-student="${studentId}"]:checked`);
            
            if (checkboxes.length === 0) {
                alert("No sessions selected");
                return;
            }
            
            // 1. 更新通知状态
            const notificationRef = doc(db, "notifications", lectureID);
            const notificationDoc = await getDoc(notificationRef);
            
            if (notificationDoc.exists()) {
                const absenceRequests = notificationDoc.data().absenceRequests || [];
                const updatedRequests = absenceRequests.map(req => {
                    if (req.studentId === studentId && req.status === "pending") {
                        // 检查这个请求是否在选中的会话中
                        const isSelected = Array.from(checkboxes).some(checkbox => 
                            checkbox.dataset.student === req.studentId &&
                            checkbox.dataset.course === req.courseCode &&
                            checkbox.dataset.subject === req.subjectId &&
                            checkbox.dataset.session === req.sessionId
                        );
                        
                        if (isSelected) {
                            return { ...req, status: "rejected" };
                        }
                    }
                    return req;
                });
                
                await updateDoc(notificationRef, { absenceRequests: updatedRequests });
            }
            
            // 2. 更新学生的缺席申请状态
            for (const checkbox of checkboxes) {
                const { course, subject, session } = checkbox.dataset;
                const [date, startTime, type, group] = session.split('_');
                
                const absenceRef = doc(db, "absence", course, group, studentId);
                const absenceDoc = await getDoc(absenceRef);
                
                if (absenceDoc.exists()) {
                    const forms = absenceDoc.data().Form || [];
                    const updatedForms = forms.map(form => {
                        const updatedSessions = (form.missedSessions || []).map(s => {
                            if (s.sessionId === session) {
                                return { ...s, status: "rejected" };
                            }
                            return s;
                        });
                        
                        // 检查是否所有session都已处理
                        const allProcessed = updatedSessions.every(s => s.status === "approved" || s.status === "rejected");
                        
                        return { 
                            ...form, 
                            missedSessions: updatedSessions,
                            status: allProcessed ? "processed" : form.status
                        };
                    });
                    
                    await updateDoc(absenceRef, { Form: updatedForms });
                }
            }
            
            alert("缺席申请已拒绝");
            loadAbsenceRequests(); // 重新加载列表
            loadAbsenceStatistics(); // 更新统计数据
            
        } catch (error) {
            console.error("Error rejecting absences:", error);
            alert("Error: " + error.message);
        }
    }

    // Add new function to check unprocessed attendance
    async function checkUnprocessedAttendance() {
        const lectureID = sessionStorage.getItem('lectureID');
        if (!lectureID) return;

        try {
            const twoWeeksAgo = new Date();
            twoWeeksAgo.setDate(twoWeeksAgo.getDate() - 14);
            
            const coursesSnapshot = await getDocs(collection(db, "course"));
            let unprocessedSessions = [];

            for (const courseDoc of coursesSnapshot.docs) {
                const courseId = courseDoc.id;
                const subjectsSnapshot = await getDocs(collection(db, "course", courseId, "subject"));

                for (const subjectDoc of subjectsSnapshot.docs) {
                    const subjectId = subjectDoc.id;
                    const subjectData = subjectDoc.data();

                    // Get attendance sessions
                    const attendanceRef = collection(db, "attendance", courseId, subjectId);
                    const sessionsSnapshot = await getDocs(attendanceRef);

                    for (const sessionDoc of sessionsSnapshot.docs) {
                        const sessionData = sessionDoc.data();
                        const [sessionDate, startTime, sessionLecturerId, sessionType, group] = sessionDoc.id.split('_');

                        // Check if this session belongs to the current lecturer
                        if (sessionLecturerId === lectureID) {
                            const sessionDateObj = new Date(sessionDate);
                            
                            // Check if session is older than 2 weeks
                            if (sessionDateObj < twoWeeksAgo) {
                                // Get students collection for this session
                                const studentsRef = collection(sessionDoc.ref, "students");
                                const studentsSnapshot = await getDocs(studentsRef);
                                
                                // Calculate unprocessed count
                                const totalStudents = sessionData.totalStudents || 0;
                                const processedCount = studentsSnapshot.size;
                                
                                if (processedCount < totalStudents) {
                                    unprocessedSessions.push({
                                        courseId,
                                        subjectId,
                                        sessionDate,
                                        startTime,
                                        sessionType: sessionType || 'lecture',
                                        group: group || 'all',
                                        unprocessedCount: totalStudents - processedCount,
                                        totalStudents
                                    });
                                }
                            }
                        }
                    }
                }
            }

            // Update UI with unprocessed sessions
            const notificationCard = document.getElementById('notificationCard');
            const listContainer = document.getElementById('unprocessedAttendanceList');

            if (unprocessedSessions.length > 0) {
                notificationCard.style.display = 'block';
                let html = '';

                for (const session of unprocessedSessions) {
                    const formattedDate = new Date(session.sessionDate).toLocaleDateString('en-US', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    html += `
                        <div class="unprocessed-alert">
                            <h4>${session.courseId} - ${session.subjectId}</h4>
                            <p><strong>Date:</strong> ${formattedDate}</p>
                            <p><strong>Time:</strong> ${session.startTime}</p>
                            <p><strong>Unprocessed:</strong> ${session.unprocessedCount} out of ${session.totalStudents} students</p>
                            <button class="view-attendance-btn" onclick="viewAttendance('${session.courseId}', '${session.subjectId}', '${session.sessionDate}', '${session.startTime}', '${session.sessionType}', '${session.group}')">
                                View Attendance
                            </button>
                        </div>
                    `;
                }

                listContainer.innerHTML = html;
            } else {
                notificationCard.style.display = 'none';
            }

        } catch (error) {
            console.error("Error checking unprocessed attendance:", error);
        }
    }

            const sessionId = `${date}_${time}_${lectureId}_${type}_${group}`;
            
            const attendanceRef = doc(db, "attendance", courseId, subjectId, sessionId);
            
            // 设置出勤记录数据
            await setDoc(attendanceRef, {
                date: date,
                startTime: time, // 使用原始时间
                lectureID: lectureId,
                type: type,
                group: group,
                totalStudents: studentsList.length,
                presentStudents: 0,
                absentStudents: 0,
                status: "pending",
                timestamp: new Date()
            });
            
            // 标记已查询过现有记录，避免下次重复检查
            sessionStorage.removeItem('checkExistingRecord');
            
            return attendanceRef;
        } catch (error) {
            console.error("创建出勤记录时出错:", error);
            throw error;
        }
    }

    // 加载现有记录中的学生出勤数据
    async function loadExistingStudentRecords(attendanceRef) {
        try {
            console.log("加载现有学生出勤记录...");
            
            const attendanceDoc = await getDoc(attendanceRef);
            if (!attendanceDoc.exists()) {
                console.error("找不到出勤记录");
                return;
            }
            
            const attendanceData = attendanceDoc.data();
            console.log("找到出勤记录数据:", attendanceData);
            
            // 加载学生列表
            const studentsRef = collection(attendanceRef, "students");
            const studentsSnapshot = await getDocs(studentsRef);
            console.log(`找到 ${studentsSnapshot.size} 条学生出勤记录`);
            
            if (studentsSnapshot.size > 0) {
                // 首先清空UI中的出勤状态
                clearAttendanceUI();
                
                // 更新出勤统计
                updateAttendanceCounters(attendanceData.presentStudents || 0, attendanceData.absentStudents || 0);
                
                // 遍历学生出勤记录
                studentsSnapshot.forEach(doc => {
                    const studentId = doc.id;
                    const studentData = doc.data();
                    
                    // 更新学生的出勤状态显示
                    updateStudentStatus(studentId, studentData.status, studentData.reason || '');
                    
                    console.log(`已更新学生 ${studentId} 的出勤状态: ${studentData.status}`);
                });
                
                console.log("所有学生出勤状态已更新");
            } else {
                console.log("没有找到学生出勤记录，状态保持不变");
            }
        } catch (error) {
            console.error("加载学生出勤记录时出错:", error);
        }
    }
    </script>
