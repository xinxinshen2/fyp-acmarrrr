<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="dumbbell.png" type="image/icon type">
    <title>Advanced Attendance System-Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
SS
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(-229deg, #cf91ff, #5782f5);
            background-size: cover;
            position: relative;
        }

        a {
            text-decoration: none;
            color: #00000075;
        }


        .logo-title-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
        }

        .heart-logo {
            height: 50px;
            margin-right: 10px;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
        }

        .admin-link {
            position: absolute;
            top: 35px;
            right: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
        }

        .container > h1 {
            font-size: 250%;
        }

        .input-login-container input {
            width: 80%;
            margin: 15px 0;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .input-login-container input:focus {
            outline: none;
            border-color: #333;
        }

        .password-container {
            position: relative;
            width: 80%;
            margin: 0 auto;
        }

        .password-container input {
            width: 100%;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            cursor: pointer;
            color: #757575;
        }

        .button {
            margin-top: 20px;
        }

        .button input {
            width: 50%;
            padding: 10px;
            /* background-color: #333; */
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            animation: buttonHover 5s ease infinite;
        }

        @keyframes buttonHover {
            0% {
              background-color: #333;
            }
            25%{
              background-color: #5782f5;
            }
            50% {
              background-color: #cf91ff;
            }

            100% {
              background-color: #333;
            }
        }

        .button input:hover {
            background: linear-gradient(-229deg, #cf91ff, #5782f5);
        }

        .button input:active {
            background-color: #777;
        }

        .links-container {
            /* display: flex; */
            justify-content: space-between;
            margin-top: 5%;
        }

        .links-container a {
            font-size: 14px;
            
        }

        #textAlertMe {
            color: red;
            display: none; /* Initially hidden */
            margin-top: 10px; /* Spacing */
        }
    </style>

    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "REMOVED",
            authDomain: "advanceas-d8db4.firebaseapp.com",
            databaseURL: "https://advanceas-d8db4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "advanceas-d8db4",
            storageBucket: "advanceas-d8db4.firebasestorage.app",
            messagingSenderId: "878892786344",
            appId: "1:878892786344:web:33bb5a97d99daf049d189d",
            measurementId: "G-PLRRKT6RWW"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 将 login 函数定义为全局函数
        window.login = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            try {
                // 首先验证登录
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // 然后从 Firestore 获取用户数据
                const userDocRef = doc(db, 'user', user.uid);
                const userDoc = await getDoc(userDocRef);
                
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    
                    // 更新最后登录时间
                    await updateDoc(userDocRef, {
                        lastLogin: new Date()
                    });
                    
                    // 存储用户 ID 和角色到 sessionStorage
                    sessionStorage.setItem('userID', userData.ID);
                    sessionStorage.setItem('role', userData.role);

                    // 根据角色跳转到不同的页面
                    if (userData.role === 'student') {
                        window.location.href = 'student_dashboard.html';//改自己student的啊啊啊
                        sessionStorage.setItem('studentID', userData.ID)
                    } else if (userData.role === 'lecturer') {
                        sessionStorage.setItem('lectureID', userData.ID);
                        window.location.href = 'lecturer_dashboard.html';
                    } else {
                        messageDiv.textContent = "未知角色";
                    }
                } else {
                    messageDiv.textContent = "登录成功，但用户数据不存在";
                }
                
            } catch (error) {
                console.error("登录错误:", error);
                messageDiv.textContent = "账户或密码错误";
            }
        }
    </script>
</head>
<body>
    <div class="logo-title-container">
        <p class="title">Advanced Attendance System</p>
    </div>

    <a class="admin-link" href="admin.html">Admin Login</a>

    <div class="container">
        <h1 style="margin-bottom: 60px;">Login</h1>

        <div class="input-login-container">
            <input type="email" id="email" placeholder="Email" required>
            
            <div class="password-container">
                <input type="password" id="password" placeholder="Password" required>
                <span class="toggle-password" onclick="togglePassword()">Show</span>
            </div>
            <div id="message"></div>
        </div>

        <div class="button">
            <input type="button" onclick="login()" value="Login">
        </div>

        <div class="links-container">
            <a href="forgot-password.html">Forgot password?</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const passwordToggle = document.querySelector(".toggle-password");
            
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                passwordToggle.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                passwordToggle.textContent = "Show";
            }
        }
    </script>
</body>
</html>
