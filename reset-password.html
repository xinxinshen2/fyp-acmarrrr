<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="dumbbell.png" type="image/icon type">
    <title>Forgot Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(-229deg, #cf91ff, #5782f5);
            background-size: cover;
            position: relative;
        }

        a {
            text-decoration: none;
            color: #757575;
        }

        .logo-title-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
        }

        .heart-logo {
            height: 50px;
            margin-right: 10px;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
        }

        .container>h1 {
            font-size: 250%;
        }

        .input-login-container input {
            width: 80%;
            margin: 15px 0;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .input-login-container input:focus {
            outline: none;
            border-color: #333;
        }

        .button {
            margin-top: 20px;
        }

        .button input {
            width: 50%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .button input:hover {
            background: linear-gradient(-229deg, #cf91ff, #5782f5);
        }

        .button input:active {
            background-color: #777;
        }

        .links-container {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .links-container a {
            font-size: 14px;
        }

        .verification-code-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .code-input {
            width: 40px !important;
            height: 40px;
            text-align: center;
            font-size: 20px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="logo-title-container">
        <!-- <img class="heart-logo" src="dumbbell.png" alt="heart-logo"> -->
        <p class="title">Advanced Attendance System</p>
    </div>

    
    <div class="container">
        <h1 style="margin-bottom: 60px;">Forgot Password</h1>

        <div class="input-login-container">
            <input type="email" id="email" placeholder="Email" required>
            <div class="button">
                <input type="button" onclick="resetPassword()" value="Reset Password">
            </div>
            <a href="login.html"> &#10094; Back to login</a>
            <p id="status-message" style="margin-top: 20px; color: #666;"></p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase functions
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
    
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAwfjKWy2tWrppcsdOGphrhkaj8Bp2fCgo",
            authDomain: "advanceas-d8db4.firebaseapp.com",
            databaseURL: "https://advanceas-d8db4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "advanceas-d8db4",
            storageBucket: "advanceas-d8db4.firebasestorage.app",
            messagingSenderId: "878892786344",
            appId: "1:878892786344:web:33bb5a97d99daf049d189d",
            measurementId: "G-PLRRKT6RWW"
        };
    
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
    
        // Reset Password Function
        window.resetPassword = async function () {
            const email = document.getElementById("email").value;
            const statusMessage = document.getElementById("status-message");
    
            if (!email) {
                statusMessage.textContent = "Please enter your email address";
                return;
            }
    
            try {
                // Step 1: Send password reset email using Firebase Auth
                await sendPasswordResetEmail(auth, email);
                statusMessage.textContent = "Password reset email sent! Please check your inbox.";
                statusMessage.style.color = "#4CAF50";
    
                // Step 2: Search for email in the Firestore database and update password
                const studentRef = collection(db, "student");
                const studentDocs = await getDocs(studentRef);
    
                let emailFound = false;
    
                for (const studentDoc of studentDocs.docs) {
                    const studentData = studentDoc.data();
    
                    // Check if the email matches
                    if (studentData.email === email) {
                        const docRef = doc(db, `student/${studentDoc.id}`);
                        await updateDoc(docRef, {
                            // passwordReset: true, // Example: Mark password reset
                            
                            lastPasswordReset: new Date().toISOString(),
                        });
    
                        console.log("Password reset field updated in Firestore for:", email);
                        emailFound = true;
                        break;
                    }
                }
    
                if (!emailFound) {
                    statusMessage.textContent = "Email not found in the student database.";
                    statusMessage.style.color = "#f44336";
                }
            } catch (error) {
                console.error("Error resetting password or updating Firestore:", error);
                statusMessage.textContent = error.message;
                statusMessage.style.color = "#f44336";
            }
        };
    </script>
    
    
    
</body>
</html>
