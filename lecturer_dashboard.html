        const app = initializeApp(firebaseConfig);

        async function loadLecturerName() {
            const lectureID = sessionStorage.getItem('lectureID');
            console.log("Lecture ID from session:", lectureID); // Debugging line
            if (!lectureID) {
                console.error("Lecture ID not found in session.");
                window.location.href = 'login.html'; // Redirect to login if lectureID is not found
                return;
            }

            const lecturerRef = doc(db, "lecturer", lectureID);
            const lecturerDoc = await getDoc(lecturerRef);

            if (lecturerDoc.exists()) {
                const lecturerData = lecturerDoc.data();
                console.log("Lecturer data retrieved:", lecturerData); // Debugging line
                document.getElementById('lecturerName').textContent = lecturerData.name;
            } else {
                console.error("No such document!");
            }
        }

        window.onload = function() {
            loadLecturerName();
        };

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = 'login.html';

        // Long Press Logic with Progress Bar
    const logoutButton = document.getElementById("logoutButton");
    const progressRect = document.querySelector(".progress-ring-rect");
    let pressTimer;
    let progressInterval;

    const startProgress = () => {
        let time = 0;
        const totalTime = 3000; // 3 seconds
        const circumference = 284; // 矩形周长 (2 * (width + height) - 8 * rx)

        progressInterval = setInterval(() => {
            time += 10; // Update every 10ms
            const progress = (time / totalTime) * circumference;
            progressRect.style.strokeDashoffset = circumference - progress;

            if (time >= totalTime) {
                clearInterval(progressInterval);
                logout(); // Call logout after 3 seconds
            }
        }, 10);
    };

    const resetProgress = () => {
        clearInterval(progressInterval);
        progressRect.style.strokeDashoffset = 284; // Reset progress
    };

    // Mouse Events
    logoutButton.addEventListener("mousedown", startProgress);
    logoutButton.addEventListener("mouseup", resetProgress);
    logoutButton.addEventListener("mouseleave", resetProgress);

    // Touch Events
    logoutButton.addEventListener("touchstart", startProgress);
    logoutButton.addEventListener("touchend", resetProgress);
    </script>
