<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="studentdashboard-style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="header nav1">
            <div class="title">
                <h2>Advanced Attendance System</h2>
                <h2 class="welcome">Welcome, <span id="username"></span></h2>
            </div>

            <div class="logout-container">
                <button class="logout" id="logoutButton">Logout</button>
                <svg class="progress-ring" width="100" height="50">
                    <rect class="progress-ring-rect" x="7" y="2.7" width="86" height="45.5" rx="13" ry="13" stroke="#ff4b5c" stroke-width="3" fill="transparent" />
                </svg>
            </div>
        </div>

        <div class="header nav2">
            <div class="nav-btn"> <p> Home  </p> </div>
            <div class="nav-btn"> <p> Absence Form  </p> </div>
            <div class="nav-btn"> <p> Data Analysis </p> </div>
            <div class="nav-btn"> <p> Timetable  </p> </div>
            <div class="nav-btn"> <p> Setting  </p> </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="homeSpace">
        <h2>Welcome to your Student Dashboard</h2>
    </div>

    <div class="dataSpace" style="display: none;">
        <h2>Data Analysis</h2>
    </div>

    <div class="functionSpace" style="display: none;">
        <h2>User Management</h2>
    </div>

    <div class="absenceFormSpace" style="display: none;">
        <h2>Absence Request Form</h2>
        <p>Please fill out this form to request an absence from school.</p>
        <form id="absenceForm">
            <div class="form-group">
                <label for="firstName">Name</label>
                <div class="input-row">
                    <input type="text" id="firstName" placeholder="First Name" required>
                    <input type="text" id="lastName" placeholder="Last Name" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@example.com" required>
            </div>

            <div class="form-group">
                <div class="input-row">
                    <div>
                        <label for="startDate">Start Date of Absence</label>
                        <input type="date" id="startDate" required>
                    </div>
                    <div>
                        <label for="endDate">End Date of Absence</label>
                        <input type="date" id="endDate" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="reason">Reason for Absence</label>
                <input type="text" id="reason" placeholder="Reason for absence" required>
            </div>

            <div class="form-group">
                <label for="comments">Additional Comments</label>
                <textarea id="comments" rows="4" placeholder="Optional"></textarea>
            </div>

            <div class="form-group">
                <label for="document">Attach Document (Optional)</label>
                <input type="file" id="document" accept=".pdf,.doc,.docx,.jpg,.png">
            </div>            

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

    <!-- Firebase & JavaScript -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "REMOVED",
            authDomain: "advanceas-d8db4.firebaseapp.com",
            databaseURL: "https://advanceas-d8db4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "advanceas-d8db4",
            storageBucket: "advanceas-d8db4.firebasestorage.app",
            messagingSenderId: "878892786344",
            appId: "1:878892786344:web:33bb5a97d99daf049d189d",
            measurementId: "G-PLRRKT6RWW"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        async function loadStudentName() {
            const studentID = sessionStorage.getItem('studentID');
            if (!studentID) {
                console.error("Student ID not found in session.");
                window.location.href = 'login.html';
                return;
            }

            const studentRef = doc(db, "student", studentID);
            const studentDoc = await getDoc(studentRef);

            if (studentDoc.exists()) {
                const studentData = studentDoc.data();
                document.getElementById('username').textContent = `${studentData.name} (${studentData.ID})`;
            } else {
                console.error("No such document!");
            }
        }

        window.onload = function() {
            loadStudentName();
        };

        // Logout function
        window.logout = function () {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            }).catch(error => {
                console.error("Error logging out:", error);
            });
        };

        // Navigation Handling
        document.addEventListener("DOMContentLoaded", function () {
            const homeBtn = document.querySelector(".nav-btn:nth-child(1)");
            const absenceFormBtn = document.querySelector(".nav-btn:nth-child(2)");
            const dataAnalysisBtn = document.querySelector(".nav-btn:nth-child(3)");

            const homeSpace = document.querySelector(".homeSpace");
            const dataSpace = document.querySelector(".dataSpace");
            const functionSpace = document.querySelector(".functionSpace");
            const absenceFormSpace = document.querySelector(".absenceFormSpace");

            homeSpace.style.display = "block";
            dataSpace.style.display = "none";
            functionSpace.style.display = "none";
            absenceFormSpace.style.display = "none";

            absenceFormBtn.addEventListener("click", function () {
                homeSpace.style.display = "none";
                dataSpace.style.display = "none";
                functionSpace.style.display = "none";
                absenceFormSpace.style.display = "block";
            });

            dataAnalysisBtn.addEventListener("click", function () {
                homeSpace.style.display = "none";
                dataSpace.style.display = "block";
                functionSpace.style.display = "none";
                absenceFormSpace.style.display = "none";
            });

            homeBtn.addEventListener("click", function () {
                homeSpace.style.display = "block";
                functionSpace.style.display = "none";
                dataSpace.style.display = "none";
                absenceFormSpace.style.display = "none";
            });
        });

    </script>

</body>
</html>
